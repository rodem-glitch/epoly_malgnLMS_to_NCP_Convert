name: Deploy LMS to NCP

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 배포 시크릿 사전 점검
        shell: bash
        env:
          NCP_WAS_SSH_KEY: ${{ secrets.NCP_WAS_SSH_KEY }}
          NCP_WEB_SSH_KEY: ${{ secrets.NCP_WEB_SSH_KEY }}
          NCP_WAS_SERVER_IP: ${{ secrets.NCP_WAS_SERVER_IP }}
          NCP_WEB_SERVER_IP: ${{ secrets.NCP_WEB_SERVER_IP }}
          NCP_DB_HOST: ${{ secrets.NCP_DB_HOST }}
          NCP_DB_PASSWORD: ${{ secrets.NCP_DB_PASSWORD }}
          LMS_DB_PASSWORD: ${{ secrets.LMS_DB_PASSWORD }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          required_vars=(
            NCP_WAS_SSH_KEY
            NCP_WEB_SSH_KEY
            NCP_WAS_SERVER_IP
            NCP_WEB_SERVER_IP
            NCP_DB_HOST
            NCP_DB_PASSWORD
            LMS_DB_PASSWORD
            QDRANT_API_KEY
            GOOGLE_API_KEY
            GEMINI_API_KEY
          )

          missing_vars=()
          for name in "${required_vars[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing_vars+=("$name")
            fi
          done

          if [ "${#missing_vars[@]}" -gt 0 ]; then
            echo "::error::필수 GitHub Secrets 누락: ${missing_vars[*]}"
            exit 1
          fi

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Spring API JAR 빌드
        shell: bash
        run: |
          set -euo pipefail
          cd polytech-lms-api
          chmod +x ./gradlew
          ./gradlew bootJar -x test

      - name: SSH 키 설정
        shell: bash
        env:
          NCP_WAS_SSH_KEY: ${{ secrets.NCP_WAS_SSH_KEY }}
          NCP_WEB_SSH_KEY: ${{ secrets.NCP_WEB_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${NCP_WAS_SSH_KEY}" > ~/.ssh/ncp_was_key
          chmod 600 ~/.ssh/ncp_was_key

          echo "${NCP_WEB_SSH_KEY}" > ~/.ssh/ncp_web_key
          chmod 600 ~/.ssh/ncp_web_key

          # 왜: private 서버라 host key 검증을 건너뜁니다.
          cat >> ~/.ssh/config <<SSHEOF
          Host ncp-was
            HostName ${{ secrets.NCP_WAS_SERVER_IP }}
            User ubuntu
            IdentityFile ~/.ssh/ncp_was_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 15

          Host ncp-web
            HostName ${{ secrets.NCP_WEB_SERVER_IP }}
            User ubuntu
            IdentityFile ~/.ssh/ncp_web_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 15
          SSHEOF
          chmod 600 ~/.ssh/config

      - name: WAS 배포 번들 생성
        shell: bash
        env:
          NCP_DB_HOST: ${{ secrets.NCP_DB_HOST }}
          NCP_DB_PASSWORD: ${{ secrets.NCP_DB_PASSWORD }}
          LMS_DB_PASSWORD: ${{ secrets.LMS_DB_PASSWORD }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_COLLECTION: ${{ secrets.QDRANT_COLLECTION }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KOSIS_CONSUMER_KEY: ${{ secrets.KOSIS_CONSUMER_KEY }}
          KOSIS_CONSUMER_SECRET: ${{ secrets.KOSIS_CONSUMER_SECRET }}
          WORK24_AUTH_KEY: ${{ secrets.WORK24_AUTH_KEY }}
          JOBKOREA_API_KEY: ${{ secrets.JOBKOREA_API_KEY }}
          JOBKOREA_OEM_CODE: ${{ secrets.JOBKOREA_OEM_CODE }}
          STATISTICS_AI_API_KEY: ${{ secrets.STATISTICS_AI_API_KEY }}
          KOLLUS_ACCESS_TOKEN: ${{ secrets.KOLLUS_ACCESS_TOKEN }}
          KOLLUS_SECURITY_KEY: ${{ secrets.KOLLUS_SECURITY_KEY }}
          KOLLUS_CHANNEL_KEY: ${{ secrets.KOLLUS_CHANNEL_KEY }}
          KOLLUS_CLIENT_USER_ID: ${{ secrets.KOLLUS_CLIENT_USER_ID }}
        run: |
          set -euo pipefail

          BUNDLE_DIR="$(pwd)/ncp-was-bundle"
          APP_DIR="${BUNDLE_DIR}/app"
          LEGACY_DIR="${BUNDLE_DIR}/legacy"
          STATS_DIR="${BUNDLE_DIR}/statistics_data"

          mkdir -p "${APP_DIR}" "${LEGACY_DIR}" "${STATS_DIR}"

          # JAR 복사
          JAR_FILE=$(find polytech-lms-api/build/libs -name "*.jar" ! -name "*plain*" | head -1)
          cp "${JAR_FILE}" "${APP_DIR}/polytech-lms-api.jar"

          # Docker Compose 복사
          cp tools/ncp/templates/docker-compose-was.yml.tpl "${BUNDLE_DIR}/docker-compose.yml"

          # 배포 스크립트 복사
          cp tools/ncp/templates/deploy-was.sh.tpl "${BUNDLE_DIR}/deploy-was.sh"
          chmod +x "${BUNDLE_DIR}/deploy-was.sh"

          # 레거시 소스 복사
          cp -r public_html "${LEGACY_DIR}/public_html"
          cp -r src "${LEGACY_DIR}/src"

          # 통계 데이터 복사
          if [ -d "통계" ]; then
            cp -r 통계/* "${STATS_DIR}/"
          fi

          # 왜: Cloud DB URL에서 mysql 컨테이너 대신 NCP Cloud DB 호스트를 사용합니다.
          APP_DB_URL="jdbc:mysql://${NCP_DB_HOST}:3306/lms?useSSL=false&allowPublicKeyRetrieval=true"
          APP_DB_URL_XML=$(echo "${APP_DB_URL}" | sed 's/&/\&amp;/g')

          # resin-web.xml 렌더링
          sed \
            -e "s|__APP_DB_URL__|${APP_DB_URL_XML}|g" \
            -e "s|__DB_USER__|lms|g" \
            -e "s|__DB_PASSWORD__|${LMS_DB_PASSWORD}|g" \
            -e "s|__LEGACY_SOURCE_DIR__|/opt/polytech-lms/legacy/src|g" \
            tools/ncp/templates/resin-web.xml.tpl \
            > "${LEGACY_DIR}/public_html/WEB-INF/resin-web.xml"

          # 왜: .env를 echo로 한 줄씩 추가하여 YAML 들여쓰기에 의존하지 않게 합니다.
          QDRANT_COLLECTION_VAL="${QDRANT_COLLECTION:-video_summary_vectors_gemini}"
          KOLLUS_CLIENT_USER_ID_VAL="${KOLLUS_CLIENT_USER_ID:-contentsummary}"
          {
            echo "MYSQL_USER=lms"
            echo "MYSQL_PASSWORD=${LMS_DB_PASSWORD}"
            echo "APP_DB_URL=${APP_DB_URL}"
            echo "QDRANT_API_KEY=${QDRANT_API_KEY}"
            echo "QDRANT_COLLECTION=${QDRANT_COLLECTION_VAL}"
            echo "GOOGLE_API_KEY=${GOOGLE_API_KEY}"
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
            echo "KOSIS_CONSUMER_KEY=${KOSIS_CONSUMER_KEY:-}"
            echo "KOSIS_CONSUMER_SECRET=${KOSIS_CONSUMER_SECRET:-}"
            echo "WORK24_AUTH_KEY=${WORK24_AUTH_KEY:-}"
            echo "JOBKOREA_API_KEY=${JOBKOREA_API_KEY:-}"
            echo "JOBKOREA_OEM_CODE=${JOBKOREA_OEM_CODE:-}"
            echo "STATISTICS_AI_API_KEY=${STATISTICS_AI_API_KEY:-}"
            echo "KOLLUS_ACCESS_TOKEN=${KOLLUS_ACCESS_TOKEN:-}"
            echo "KOLLUS_SECURITY_KEY=${KOLLUS_SECURITY_KEY:-}"
            echo "KOLLUS_CHANNEL_KEY=${KOLLUS_CHANNEL_KEY:-}"
            echo "KOLLUS_CLIENT_USER_ID=${KOLLUS_CLIENT_USER_ID_VAL}"
          } > "${BUNDLE_DIR}/.env"

          echo "WAS 번들 생성 완료: ${BUNDLE_DIR}"
          ls -la "${BUNDLE_DIR}"

      - name: WAS 번들 전송 및 배포
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail

          BUNDLE_DIR="$(pwd)/ncp-was-bundle"
          ARCHIVE="ncp-was-bundle.tar.gz"

          # 왜: 파일 수가 많아 디렉터리 재귀 scp가 느리므로, tar.gz 단일 파일 전송으로 시간을 줄입니다.
          tar -czf "${ARCHIVE}" -C "$(dirname "${BUNDLE_DIR}")" "$(basename "${BUNDLE_DIR}")"

          scp -F ~/.ssh/config "${ARCHIVE}" ncp-was:~/

          ssh -F ~/.ssh/config ncp-was bash -s <<'REMOTEOF'
          set -euo pipefail
          rm -rf ~/ncp-was-bundle
          tar -xzf ~/ncp-was-bundle.tar.gz -C ~/
          rm -f ~/ncp-was-bundle.tar.gz
          if [ "$(id -u)" -eq 0 ]; then
            timeout 360 bash ~/ncp-was-bundle/deploy-was.sh ~/ncp-was-bundle
          elif sudo -n true >/dev/null 2>&1; then
            sudo -n timeout 360 bash ~/ncp-was-bundle/deploy-was.sh ~/ncp-was-bundle
          else
            echo "sudo 권한이 필요합니다."
            exit 1
          fi
          REMOTEOF

          echo "WAS 배포 완료"

      - name: WEB Nginx 설정 전송 및 배포
        shell: bash
        timeout-minutes: 5
        env:
          NCP_WAS_SERVER_IP: ${{ secrets.NCP_WAS_SERVER_IP }}
          WEB_DOMAIN: ${{ secrets.WEB_DOMAIN }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        run: |
          set -euo pipefail

          NGINX_DIR="$(pwd)/ncp-nginx-conf"
          mkdir -p "${NGINX_DIR}"

          WAS_IP="${NCP_WAS_SERVER_IP}"
          DOMAIN="${WEB_DOMAIN:-}"

          # 왜: Nginx 템플릿의 플레이스홀더를 실제 WAS IP와 도메인으로 치환합니다.
          sed \
            -e "s|__WAS_IP__|${WAS_IP}|g" \
            -e "s|__WEB_DOMAIN__|${DOMAIN:-_}|g" \
            tools/ncp/templates/nginx-web.conf.tpl \
            > "${NGINX_DIR}/lms-web.conf"

          # 배포 스크립트 복사
          cp tools/ncp/templates/deploy-web.sh.tpl "${NGINX_DIR}/deploy-web.sh"
          chmod +x "${NGINX_DIR}/deploy-web.sh"

          scp -F ~/.ssh/config -r "${NGINX_DIR}" ncp-web:~/nginx-conf

          LE_EMAIL="${LETSENCRYPT_EMAIL:-}"
          ssh -F ~/.ssh/config ncp-web bash -s <<REMOTEOF
          set -euo pipefail
          if [ "\$(id -u)" -eq 0 ]; then
            bash ~/nginx-conf/deploy-web.sh ~/nginx-conf "${DOMAIN}" "${LE_EMAIL}"
          elif sudo -n true >/dev/null 2>&1; then
            sudo -n bash ~/nginx-conf/deploy-web.sh ~/nginx-conf "${DOMAIN}" "${LE_EMAIL}"
          else
            echo "sudo 권한이 필요합니다."
            exit 1
          fi
          REMOTEOF

          echo "WEB 배포 완료"

      - name: 스모크 테스트 (WAS API)
        if: success()
        shell: bash
        env:
          NCP_WAS_SERVER_IP: ${{ secrets.NCP_WAS_SERVER_IP }}
        run: |
          set -euo pipefail
          # 왜: WAS 컨테이너 시작까지 대기합니다.
          echo "WAS API 헬스 체크 대기 (최대 60초)..."
          for i in $(seq 1 12); do
            if ssh -F ~/.ssh/config ncp-was "curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/actuator/health" 2>/dev/null; then
              echo ""
              echo "WAS API 헬스 체크 성공"
              exit 0
            fi
            echo "대기 중... ($i/12)"
            sleep 5
          done
          echo "::warning::WAS API 헬스 체크 타임아웃 (컨테이너 시작 중일 수 있음)"

      - name: 스모크 테스트 (WEB Nginx)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          echo "WEB Nginx 상태 확인..."
          ssh -F ~/.ssh/config ncp-web "sudo -n nginx -t && echo 'Nginx config OK'"
          ssh -F ~/.ssh/config ncp-web "curl -fsS -o /dev/null -w 'http_code=%{http_code}\n' http://127.0.0.1/ || echo 'WEB 루트 접근 확인 필요 (WAS 시작 대기 중일 수 있음)'"

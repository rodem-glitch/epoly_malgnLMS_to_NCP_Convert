# 왜: dev/stag 브랜치 push 및 PR에서 빌드가 깨지지 않는지 검증합니다.
# prod 배포(deploy-lms-ncp.yml)와 분리하여, 개발 중에도 빠르게 피드백을 받을 수 있습니다.
name: CI Validate

on:
  push:
    branches: [dev, stag]
  pull_request:
    branches: [dev, stag, prod]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Spring Boot JAR 빌드 검증
        run: cd polytech-lms-api && chmod +x ./gradlew && ./gradlew bootJar -x test

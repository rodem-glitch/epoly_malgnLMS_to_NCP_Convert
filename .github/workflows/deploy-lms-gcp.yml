name: Deploy LMS to GCP + Firebase

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 배포 시크릿 사전 점검
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          LMS_DB_PASSWORD: ${{ secrets.LMS_DB_PASSWORD }}
          LMS_DB_ROOT_PASSWORD: ${{ secrets.LMS_DB_ROOT_PASSWORD }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          required_vars=(
            GCP_SA_KEY
            GCP_PROJECT_ID
            LMS_DB_PASSWORD
            LMS_DB_ROOT_PASSWORD
            QDRANT_API_KEY
            GOOGLE_API_KEY
            GEMINI_API_KEY
          )

          missing_vars=()
          for name in "${required_vars[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing_vars+=("$name")
            fi
          done

          if [ "${#missing_vars[@]}" -gt 0 ]; then
            echo "::error::필수 GitHub Secrets 누락: ${missing_vars[*]}"
            exit 1
          fi

          if [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo "::warning::FIREBASE_TOKEN이 비어 있습니다. Firebase는 서비스 계정(ADC)으로 배포를 시도합니다."
          fi

          if [ -z "${{ secrets.GCP_VM_SSH_USER }}" ]; then
            echo "::warning::GCP_VM_SSH_USER가 비어 있습니다. one-click 스크립트의 SSH 자동 후보 탐색을 사용합니다."
          fi

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: GCP 인증
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          create_credentials_file: true
          export_environment_variables: true

      - name: gcloud 설치
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Firebase CLI 설치
        run: npm install -g firebase-tools

      - name: 배포 도구 버전 확인
        run: |
          gcloud --version
          firebase --version

      - name: VM SSH 권한 사전 점검
        id: vm_ssh_probe
        shell: bash
        env:
          VM_NAME: polytech-lms-vm
          VM_ZONE: asia-northeast3-a
          VM_SSH_USER_SECRET: ${{ secrets.GCP_VM_SSH_USER }}
        run: |
          set -euo pipefail

          if ! gcloud compute instances describe "$VM_NAME" --zone "$VM_ZONE" --project "${{ secrets.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            echo "::warning::VM($VM_NAME)가 아직 없어 SSH 사전 점검을 건너뜁니다."
            echo "ssh_user=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          candidates=()
          if [ -n "${VM_SSH_USER_SECRET:-}" ]; then
            candidates+=("${VM_SSH_USER_SECRET}")
          fi
          active_user="$(gcloud config get-value account 2>/dev/null | cut -d'@' -f1 || true)"
          if [ -n "${active_user:-}" ] && [ "${active_user}" != "(unset)" ]; then
            candidates+=("${active_user}")
          fi
          candidates+=("newkl" "ubuntu" "root")

          selected=""
          tried=""
          for user in "${candidates[@]}"; do
            [ -z "${user}" ] && continue
            case " ${tried} " in
              *" ${user} "*) continue ;;
            esac
            tried="${tried} ${user}"

            echo "SSH 권한 점검: ${user}@${VM_NAME}"
            if gcloud compute ssh "${user}@${VM_NAME}" \
              --zone "$VM_ZONE" \
              --project "${{ secrets.GCP_PROJECT_ID }}" \
              --quiet \
              --strict-host-key-checking=no \
              --ssh-flag=-oBatchMode=yes \
              --ssh-flag=-oConnectTimeout=15 \
              --ssh-flag=-T \
              --command 'if [ "$(id -u)" -eq 0 ] || sudo -n true >/dev/null 2>&1; then echo ok; else echo no_sudo; exit 19; fi' \
              >/dev/null 2>&1; then
              selected="${user}"
              break
            fi
          done

          if [ -z "${selected}" ]; then
            echo "::error::VM SSH 접속/권한 확인에 실패했습니다. 시도 사용자:${tried}"
            exit 1
          fi

          echo "ssh_user=${selected}" >> "$GITHUB_OUTPUT"
          echo "선택된 VM SSH 사용자: ${selected}"

      - name: 원클릭 배포 실행 (VM 스택)
        id: vm_stack
        continue-on-error: true
        shell: pwsh
        run: |
          $errorHead = "OK"
          $invokeOneClick = {
            $vmSshUser = "${{ steps.vm_ssh_probe.outputs.ssh_user }}"
            if ([string]::IsNullOrWhiteSpace($vmSshUser)) {
              ./tools/gcp/one-click-setup.ps1 `
                -ProjectId "${{ secrets.GCP_PROJECT_ID }}" `
                -Region "asia-northeast3" `
                -Zone "asia-northeast3-a" `
                -VmName "polytech-lms-vm" `
                -ApiDomain "api.example.com" `
                -WwwDomain "epoly-kopo.web.app" `
                -FirebaseSite "epoly-kopo" `
                -DbName "lms" `
                -DbUser "lms" `
                -DbPassword "${{ secrets.LMS_DB_PASSWORD }}" `
                -DbRootPassword "${{ secrets.LMS_DB_ROOT_PASSWORD }}" `
                -QdrantApiKey "${{ secrets.QDRANT_API_KEY }}" `
                -GoogleApiKey "${{ secrets.GOOGLE_API_KEY }}" `
                -GeminiApiKey "${{ secrets.GEMINI_API_KEY }}" `
                -LetsEncryptEmail "${{ secrets.LETSENCRYPT_EMAIL }}" `
                -SkipProjectBootstrap `
                -SkipFirebaseDeploy
            } else {
              ./tools/gcp/one-click-setup.ps1 `
                -ProjectId "${{ secrets.GCP_PROJECT_ID }}" `
                -Region "asia-northeast3" `
                -Zone "asia-northeast3-a" `
                -VmName "polytech-lms-vm" `
                -VmSshUser "$vmSshUser" `
                -ApiDomain "api.example.com" `
                -WwwDomain "epoly-kopo.web.app" `
                -FirebaseSite "epoly-kopo" `
                -DbName "lms" `
                -DbUser "lms" `
                -DbPassword "${{ secrets.LMS_DB_PASSWORD }}" `
                -DbRootPassword "${{ secrets.LMS_DB_ROOT_PASSWORD }}" `
                -QdrantApiKey "${{ secrets.QDRANT_API_KEY }}" `
                -GoogleApiKey "${{ secrets.GOOGLE_API_KEY }}" `
                -GeminiApiKey "${{ secrets.GEMINI_API_KEY }}" `
                -LetsEncryptEmail "${{ secrets.LETSENCRYPT_EMAIL }}" `
                -SkipProjectBootstrap `
                -SkipFirebaseDeploy
            }
          }

          $maxAttempts = 2
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host ("[deploy] one-click 실행 시도 {0}/{1}" -f $attempt, $maxAttempts)
            try {
              & $invokeOneClick
              Write-Host "[deploy] one-click 실행 성공"
              "error_head=$errorHead" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              break
            } catch {
              $firstLine = ($_.Exception.Message -split "`r?`n")[0]
              $errorHead = $firstLine -replace '[^a-zA-Z0-9ㄱ-힣 _:\\/\\.-]', ''
              if ($errorHead.Length -gt 120) {
                $errorHead = $errorHead.Substring(0, 120)
              }
              if ($attempt -eq $maxAttempts) {
                "error_head=$errorHead" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                throw
              }
              Write-Host ("[deploy] one-click 실행 실패, 재시도합니다: {0}" -f $_.Exception.Message) -ForegroundColor Yellow
              Start-Sleep -Seconds 20
            }
          }

      - name: 원클릭 실패 확인 (${{ steps.vm_stack.outputs.error_head }})
        if: steps.vm_stack.outcome == 'failure'
        run: |
          echo "one-click 실패: ${{ steps.vm_stack.outputs.error_head }}"
          exit 1

      - name: vmproxy 대상 VM IP 동기화
        if: steps.vm_stack.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          vm_ip="$(gcloud compute addresses describe polytech-lms-vm-ip --region asia-northeast3 --project "${{ secrets.GCP_PROJECT_ID }}" --format='value(address)')"
          if [ -z "${vm_ip}" ]; then
            echo "::error::고정 IP(polytech-lms-vm-ip)를 조회하지 못했습니다."
            exit 1
          fi

          target_url="http://${vm_ip}"
          echo "VM_IP=${vm_ip}" >> "${GITHUB_ENV}"
          echo "VM_PROXY_TARGET=${target_url}" >> "${GITHUB_ENV}"

          sed -i -E "s#^const TARGET = \"http://[^\"]+\";#const TARGET = \"${target_url}\";#" tools/gcp/firebase-proxy-deploy/functions/index.js
          grep -n "^const TARGET" tools/gcp/firebase-proxy-deploy/functions/index.js

      - name: Firebase vmproxy 함수 의존성 설치
        if: steps.vm_stack.outcome == 'success'
        run: npm --prefix tools/gcp/firebase-proxy-deploy/functions ci

      - name: vmproxy 함수 문법 점검
        if: steps.vm_stack.outcome == 'success'
        run: node --check tools/gcp/firebase-proxy-deploy/functions/index.js

      - name: Firebase vmproxy + Hosting 배포
        if: steps.vm_stack.outcome == 'success'
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          cd tools/gcp/firebase-proxy-deploy
          firebase_args=(deploy --project "${{ secrets.GCP_PROJECT_ID }}" --only functions:vmproxy,hosting --non-interactive)

          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "Firebase 인증: FIREBASE_TOKEN 사용"
            firebase_args+=(--token "${FIREBASE_TOKEN}")
          else
            echo "Firebase 인증: 서비스 계정(ADC) 사용"
          fi

          firebase "${firebase_args[@]}"

      - name: 배포 후 스모크 테스트
        if: steps.vm_stack.outcome == 'success'
        run: |
          curl -fsS -o /dev/null -w "health=%{http_code}\n" https://epoly-kopo.web.app/actuator/health
          curl -fsS -o /dev/null -w "root=%{http_code}\n" https://epoly-kopo.web.app/

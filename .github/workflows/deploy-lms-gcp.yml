name: Deploy LMS to GCP + Firebase

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: GCP 인증
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: gcloud 설치
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Firebase CLI 설치
        run: npm install -g firebase-tools

      - name: 배포 도구 버전 확인
        run: |
          gcloud --version
          firebase --version

      - name: 원클릭 배포 실행 (VM 스택)
        shell: pwsh
        run: |
          $vmSshUser = "${{ secrets.GCP_VM_SSH_USER }}"
          if ([string]::IsNullOrWhiteSpace($vmSshUser)) {
            $vmSshUser = "newkl"
          }

          ./tools/gcp/one-click-setup.ps1 `
            -ProjectId "${{ secrets.GCP_PROJECT_ID }}" `
            -Region "asia-northeast3" `
            -Zone "asia-northeast3-a" `
            -VmName "polytech-lms-vm" `
            -VmSshUser "$vmSshUser" `
            -ApiDomain "api.example.com" `
            -WwwDomain "epoly-kopo.web.app" `
            -FirebaseSite "epoly-kopo" `
            -DbName "lms" `
            -DbUser "lms" `
            -DbPassword "${{ secrets.LMS_DB_PASSWORD }}" `
            -DbRootPassword "${{ secrets.LMS_DB_ROOT_PASSWORD }}" `
            -QdrantApiKey "${{ secrets.QDRANT_API_KEY }}" `
            -GoogleApiKey "${{ secrets.GOOGLE_API_KEY }}" `
            -GeminiApiKey "${{ secrets.GEMINI_API_KEY }}" `
            -LetsEncryptEmail "${{ secrets.LETSENCRYPT_EMAIL }}" `
            -SkipProjectBootstrap `
            -SkipFirebaseDeploy

      - name: Firebase vmproxy 함수 의존성 설치
        run: npm --prefix tools/gcp/firebase-proxy-deploy/functions ci

      - name: Firebase vmproxy + Hosting 배포
        run: |
          cd tools/gcp/firebase-proxy-deploy
          firebase deploy --project "${{ secrets.GCP_PROJECT_ID }}" --only functions:vmproxy,hosting --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: 배포 후 스모크 테스트
        run: |
          curl -fsS -o /dev/null -w "health=%{http_code}\n" https://epoly-kopo.web.app/actuator/health
          curl -fsS -o /dev/null -w "root=%{http_code}\n" https://epoly-kopo.web.app/

# ============================================
# Backend Cloud Run Deploy
# ============================================
#
# 배포 대상:
#   1. growailms-backend (eGovFrame 4.3, MyBatis 3.5, JWT + Keycloak)
#   2. growailms-legacy (Java 8, JSP, Tomcat 9)
#

name: Backend Cloud Run Deploy

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'growailms-backend/**'
      - 'public_html/**'
      - 'src/**'
      - 'Dockerfile.legacy'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - legacy

env:
  PROJECT_ID: \${{ secrets.GCP_PROJECT_ID }}
  REGION: \${{ secrets.GCP_REGION || 'asia-northeast1' }}
  ARTIFACT_REGISTRY: \${{ secrets.GCP_REGION || 'asia-northeast1' }}-docker.pkg.dev

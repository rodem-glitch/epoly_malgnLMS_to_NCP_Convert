                    <form name="form1" method="post" action="/member/login.jsp" target="sysfrm" onsubmit="return goSubmit(this);">
					<!--@if(udid)--><input type="hidden" name="udid" value="{{udid}}"><!--/if(udid)-->

					<input type="hidden" name="returl" value="{{returl}}">

	<script>
	function goSubmit(f) {
		if(!validate(f)) return false;
		if(f['save_id'].checked) SetCookie("SAVEID", f['id'].value, 3600 * 24 * 30, "/");
		else SetCookie("SAVEID", "");
		return true;
	}
	addEvent("onload", function() {
		var f = document.forms['form1'];
		if(!f) return;
		// 왜: 테스트 계정으로 즉시 로그인해야 하는 운영 요청이라 저장 쿠키보다 기본 프리셋을 우선합니다.
		f['id'].value = "{{login_id_preset}}";
		f['passwd'].value = "{{login_passwd_preset}}";
		f['save_id'].checked = false;
	});
	</script>
	<div class="footer_login">
		{{SITE_INFO.copyright}}
	</div>

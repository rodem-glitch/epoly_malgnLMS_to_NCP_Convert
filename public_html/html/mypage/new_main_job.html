<div class="new-main-job" id="new-main-job">
	<style>
		/* 채용 페이지 전용 스타일 */
		.new-main-job {
			background: #f9fafb;
			font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
		}

		/* 컨테이너 */
		.nm-container {
			max-width: 1200px;
			margin: 0 auto;
			padding: 24px 20px 60px;
		}

		/* 채용 영역 */
		.nm-job__header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 16px;
		}
		.nm-job__title {
			font-size: 20px;
			font-weight: 700;
			color: #101828;
		}
		.nm-job__hint {
			font-size: 12px;
			color: #667085;
		}
		.nm-job__iframe {
			width: 100%;
			min-height: 1100px;
			border: none;
			border-radius: 16px;
			background: #fff;
			box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
		}
		@media (max-width: 992px) {
			.nm-job__iframe {
				min-height: 900px;
				border-radius: 12px;
			}
		}
	</style>

	<main class="nm-container">
		<div class="nm-job__header">
			<div class="nm-job__title">채용</div>
			<div class="nm-job__hint">학과 기준으로 직무 분류가 자동 선택됩니다.</div>
		</div>
		<iframe class="nm-job__iframe" src="{{job_iframe_url}}" title="채용 공고"></iframe>
	</main>

	<script>
	// iframe 높이 자동 조절 (스크롤 통합)
	window.addEventListener('message', function(e) {
		if (e.data && e.data.type === 'iframeHeight') {
			var iframe = document.querySelector('.nm-job__iframe');
			if (iframe && e.data.height) {
				iframe.style.height = e.data.height + 'px';
				iframe.style.minHeight = 'auto';
			}
		}
	});
	</script>
</div>
